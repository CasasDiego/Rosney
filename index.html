<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para Rosney ❤️</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="stars"></div>
    <div class="container">
        <div class="content" id="content">
            <h1 class="title">Para mi amor, Rosney 💙</h1>
            <p class="message">
                Aunque estés lejos, en mis pensamientos siempre estás conmigo.<br>
                Cada día que pasa es un día menos para volver a verte.<br>
                <strong>¡Pronto estarás aquí a mi lado!</strong>
            </p>
            <button class="bloom-button" id="bloomBtn">
                ✨ Haz clic para ver florecer tu jardín ✨
            </button>
        </div>

        <div class="garden hidden" id="garden">
            <h2 class="garden-title">Tu Jardín Especial 🌸</h2>
            <div class="flowers-container" id="flowersContainer"></div>
            <div class="final-message hidden" id="finalMessage">
                <h3>🌹 Feliz San Valentín, Rosney 🌹</h3>
                <p> <br>
                    La extraño mucho por aquí💙<br>
                    ¡Nos vemos pronto, mi amor!</p>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
